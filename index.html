<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function() {
        var theme = localStorage.getItem('faka_brand_theme') || 'ocean';
        if (theme === 'coral') document.documentElement.classList.add('theme-coral');
        else document.documentElement.classList.add('theme-ocean');

        var dark = localStorage.getItem('faka_theme');
        if (dark === 'dark' || (!dark && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Faka" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Faka — HR & Payroll Platform for Modern Enterprises</title>
    <meta name="description" content="Faka: HR and Payroll platform developed by LiAfrik. Contracts, multichannel payroll, employee self-service, analytics and compliance — built to international standards." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
